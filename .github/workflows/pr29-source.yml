name: PR29 source snapshot
on:
  push:
    branches: [feat/world-diplomacy-cartography]
    paths: [.github/workflows/pr29-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact branch source
        run: |
          git rev-parse HEAD > commit.txt
          git archive --format=tar HEAD | gzip -1 > source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: paladin-pr29-source
          path: |
            source.tar.gz
            commit.txt
          retention-days: 3
          if-no-files-found: error
