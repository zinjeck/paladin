name: PR31 battle simulation source
on:
  push:
    branches: [feat/pr31-world-interaction-battle-simulation]
    paths: [.github/workflows/pr31-battle-model.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'zinjeck/paladin' && github.ref == 'refs/heads/feat/pr31-world-interaction-battle-simulation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Validate and commit source
        shell: python
        run: |
          import base64,gzip,hashlib,pathlib,subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^')=='b0b138ebc369ec0c7d6e652f4f72db74d2968372'
          encoded=''
          pathlib.Path('transport.txt').write_text(encoded)
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='4497acb23d34c27203c669aed187a60fd33b3ceff6a73e19d9ecb891ef5b8797'
          path=pathlib.Path('/tmp/battle.patch');path.write_bytes(patch)
          allowed={'CMakeLists.txt','src/simulation/BattleSystem.cpp','src/simulation/BattleSystem.h','src/simulation/MilitarySystem.cpp','src/simulation/MilitarySystem.h','src/simulation/DiplomacySystem.cpp','src/simulation/DiplomacySystem.h','src/world/Army.h','src/world/World.h','tests/Pr31BattleChecks.h','tests/TestMain.cpp'}
          assert {line.split('\t')[-1] for line in git('apply','--numstat',str(path)).splitlines()}==allowed
          subprocess.run(['git','apply','--check','--index',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          git('rm','.github/workflows/pr31-battle-model.yml')
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','feat(pr31): army pursuit, contact battles, retreat and conserved-personnel autoresolve')
          git('push','origin','HEAD:refs/heads/feat/pr31-world-interaction-battle-simulation')
      - name: Archive recoverable source and transport
        if: always()
        run: |
          mkdir checkpoint
          git rev-parse HEAD > checkpoint/commit.txt
          git archive HEAD | gzip -n > checkpoint/source.tar.gz
          if [ -f transport.txt ]; then cp transport.txt checkpoint/transport.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr31-battle-model-source
          path: checkpoint
          retention-days: 7
