name: PR32 atomic source publication
on:
  push:
    branches: [fix/pr32-further-updates]
    paths: [.github/workflows/pr32-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'zinjeck/paladin' && github.ref == 'refs/heads/fix/pr32-further-updates'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate and apply exact-base source changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 3d22d4e64f61ce4f99ac83723eefc57e7b0c73aa
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          encoded = ''''''
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '2567c2ecce734681d8501be2376656243db6c441bd939c53b37ab2c19a2b76fd'
          path = pathlib.Path('/tmp/pr32-source.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          PY
          git rm .github/workflows/pr32-publish.yml .github/workflows/pr32-review-source.yml
          git diff --cached --check
          git config user.name 'Paladin PR32 completion'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finish depot input lifetime, reachable AI commerce and patrol regressions'
          git push origin HEAD:refs/heads/fix/pr32-further-updates
