name: PR32 review source snapshot

on:
  push:
    branches: [fix/pr32-further-updates]
    paths: [.github/workflows/pr32-review-source.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Archive the exact review source
        run: |
          mkdir -p review-source
          git rev-parse HEAD > review-source/commit.txt
          git archive --format=tar HEAD | gzip > review-source/paladin-source.tar.gz
      - name: Fetch the pinned build dependencies
        run: |
          mkdir -p review-deps
          git clone --depth 1 --branch release-3.2.20 https://github.com/libsdl-org/SDL.git review-deps/sdl3-src
          git clone --depth 1 --branch release-3.2.2 --recurse-submodules --shallow-submodules https://github.com/libsdl-org/SDL_ttf.git review-deps/sdl3_ttf-src
          git clone --depth 1 --branch release-3.2.4 https://github.com/libsdl-org/SDL_image.git review-deps/sdl3_image-src
          tar --exclude=.git -czf review-source/paladin-deps.tar.gz review-deps
      - uses: actions/upload-artifact@v4
        with:
          name: pr32-review-source
          path: review-source
          if-no-files-found: error
          retention-days: 2
