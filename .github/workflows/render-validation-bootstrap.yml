name: Rendering validation bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sources:
    if: github.head_ref == 'fix/world-surface-cartography-stability'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bundle the exact test inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-source/deps
          git archive HEAD src tests tools config assets CMakeLists.txt AGENTS.md .github > validation-source/paladin.tar
          git clone --depth 1 --branch release-3.2.20 https://github.com/libsdl-org/SDL.git validation-source/deps/SDL3
          git clone --depth 1 --branch release-3.2.2 https://github.com/libsdl-org/SDL_ttf.git validation-source/deps/SDL3_ttf
          git -C validation-source/deps/SDL3_ttf submodule update --init --depth 1 external/freetype
          git clone --depth 1 --branch release-3.2.4 https://github.com/libsdl-org/SDL_image.git validation-source/deps/SDL3_image
          find validation-source/deps -name .git -prune -exec rm -rf {} +
          tar -C validation-source -cf validation-source/deps.tar deps
          rm -rf validation-source/deps
      - uses: actions/upload-artifact@v4
        with:
          name: paladin-render-validation-inputs
          path: validation-source/*.tar
          retention-days: 1
          compression-level: 6
