name: Apply verified PR29 implementation
on:
  push:
    branches: [feat/world-diplomacy-cartography]
    paths: [.github/workflows/pr29-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/world-diplomacy-cartography
          fetch-depth: 2
      - name: Apply and commit verified source patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "a63e09f2d0ec4f515e61212dcf39b2c8e527a6f5"
          git diff --exit-code HEAD^ HEAD -- . ':(exclude).github/workflows/pr29-apply.yml'
          archive="$RUNNER_TEMP/pr29.patch.xz"
          patch="$RUNNER_TEMP/pr29.patch"
          : > "$archive"
          for blob in \
            76052b770ceb6a25862686b8cdd9be3da80bf32d \
            96add712b4cc24c114c3ce51e6dacabf3f4dfdcd \
            c9b7e253c38166a5c356ac954140e7447beb2ee7 \
            dc70ae6bc312684c105cb010217a64af40ef8683 \
            3fb951e63a2e2630d1cb6b248683165d5cb07bea \
            ca39972e53e227d20ada932ec065849196437431; do
            gh api "repos/zinjeck/paladin/git/blobs/$blob" --jq '.content' | base64 --decode >> "$archive"
          done
          echo "4f79191545839eef90ab5131d31c807c271f6fac5083d2d51b05a2ca8b3f9826  $archive" | sha256sum -c -
          xz -dc "$archive" > "$patch"
          echo "6ef305948f3447b8c5754a5f5ce4e9bea81fcb11ce5c9794d5af23eafc6eecea  $patch" | sha256sum -c -
          git apply --check "$patch"
          git apply --index "$patch"
          git rm -- .github/workflows/pr29-apply.yml
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Replace world sprawl, add diplomacy and thematic maps, and compact army controls"
          git push origin HEAD:feat/world-diplomacy-cartography
          git rev-parse HEAD
