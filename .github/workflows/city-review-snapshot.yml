name: City review source snapshot
on:
  push:
    branches: [fix/city-art-resource-flow]
    paths: [.github/workflows/city-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source for offline review
        run: git archive --format=zip HEAD -o /tmp/paladin-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: city-review-source
          path: /tmp/paladin-source.zip
          retention-days: 1
