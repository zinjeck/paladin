name: Apply city review fixes
on:
  push:
    branches: [fix/city-art-resource-flow]
    paths:
      - '.github/workflows/city-review-snapshot.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          for patch in .review-patches/*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          rm -rf .review-patches
          rm .github/workflows/city-review-snapshot.yml
          git diff --check
      - name: Commit reviewed changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix city art presentation and goods flow reporting"
          git push origin HEAD:fix/city-art-resource-flow
