name: Publish verified input fixture
on:
  push:
    branches: [fix/world-billboards-city-army-flow]
    paths: [.github/workflows/pr28-publish-input-fixture.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact locally tested fixture and review notes
        shell: python
        run: |
          import base64, hashlib, json, lzma, pathlib, subprocess
          encoded = ''''''
          raw = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest() == '8a83fca9c7decfe7ac835aade889f9f8337fb07dacb4204640c2951a1cac0a0b'
          pending = []
          for name, before, after, edits in json.loads(raw):
              assert name in ('tests/ApplicationSmokeTests.cpp', 'docs/reviews/2026-09-18-world-army-fixes.md')
              path = pathlib.Path(name)
              original = path.read_bytes()
              assert hashlib.sha256(original).hexdigest() == before, name
              lines = original.decode('utf-8').splitlines(keepends=True)
              for start, count, text in reversed(edits):
                  lines[start:start+count] = [text]
              revised = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(revised).hexdigest() == after, name
              pending.append((path, revised))
          for path, revised in pending:
              path.write_bytes(revised)
              subprocess.run(['git', 'add', '-f', '--', str(path)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
      - name: Commit fixture correction to this review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Synchronize synthetic clicks with SDL pointer state to prevent phantom edge scrolling'
          git push origin HEAD:refs/heads/fix/world-billboards-city-army-flow
