name: Apply verified world and army fixes
on:
  push:
    branches: [fix/world-billboards-city-army-flow]
    paths: [.github/workflows/pr-world-army-review-inputs.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact locally tested source edits
        shell: python
        run: |
          import base64, hashlib, json, lzma, pathlib, subprocess
          encoded = '''
          
          
          '''
          raw = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest() == '0777d412506b6bb8ec1eea26781177d6f19b9103aa93f12b1df2b5c778b43878'
          pending = []
          for name, before, after, edits in json.loads(raw):
              path = pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in ('src', 'tests', 'docs')
              original = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(original).hexdigest() == before, name
              lines = original.decode('utf-8').splitlines(keepends=True)
              for start, count, text in reversed(edits):
                  lines[start:start+count] = [text]
              revised = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(revised).hexdigest() == after, name
              pending.append((path, revised))
          for path, revised in pending:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(revised)
              subprocess.run(['git', 'add', '-f', '--', str(path)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
      - name: Commit tested fixes to this review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix upright world billboards, full selection outlines and independent city armies'
          git push origin HEAD:refs/heads/fix/world-billboards-city-army-flow
