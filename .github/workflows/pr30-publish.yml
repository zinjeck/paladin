name: PR30 publish verified source
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [.github/pr30-patch.json, .github/workflows/pr30-publish.yml]
permissions:
  contents: write
concurrency:
  group: pr30-source-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/pr30-citizenship-logistics-selection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply exact checked source diff without executing source code
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: python {0}
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, zlib
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          path = pathlib.Path('.github/pr30-patch.json')
          if not path.exists():
              raise SystemExit('No pending source patch')
          if path.stat().st_size > 2000000:
              raise SystemExit('Patch envelope too large')
          data = json.loads(path.read_text())
          if os.environ['PR_BRANCH'] != 'feat/pr30-citizenship-logistics-selection':
              raise SystemExit('Unexpected target branch')
          git('merge-base', '--is-ancestor', data['base'], 'HEAD')
          patch = zlib.decompress(base64.b64decode(data['patch_zlib_base64'], validate=True))
          if len(patch) > 8000000 or hashlib.sha256(patch).hexdigest() != data['sha256']:
              raise SystemExit('Source patch checksum/size mismatch')
          # Workflow updates use the authorized connector, never this job token.
          # Its independently installed final content must exactly match first.
          if git('hash-object', '.github/workflows/pr-ci.yml') != 'ea111d9bbd39abfdc8bfce08ebd06adaaf2d5817':
              raise SystemExit('Install the separately authorized CI evidence update first')
          scratch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr30-verified.patch'
          scratch.write_bytes(patch)
          git('apply', '--check', '--index', '--exclude=.github/workflows/pr-ci.yml', str(scratch))
          git('apply', '--index', '--exclude=.github/workflows/pr-ci.yml', str(scratch))
          names = git('diff', '--cached', '--name-only', '-z').split('\0')
          for name in filter(None, names):
              if not (name.startswith(('src/', 'tests/', 'docs/')) or name in ('CMakeLists.txt', 'AGENTS.md')):
                  raise SystemExit('Disallowed source path: ' + name)
          git('diff', '--cached', '--check')
          git('rm', '.github/pr30-patch.json')
          git('config', 'user.name', 'Paladin PR30 source publisher')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('commit', '-m', data['message'])
          # A concurrent edit fails safely; never force-push over it.
          git('push', 'origin', 'HEAD:refs/heads/' + os.environ['PR_BRANCH'])
          sha = git('rev-parse', 'HEAD')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Published source commit `' + sha + '` after exact patch/checksum validation.\n')
