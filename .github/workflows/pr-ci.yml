name: Paladin PR CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: paladin-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows build and tests
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DPALADIN_BUILD_APPLICATION_SMOKE_TESTS=OFF

      - name: Build Paladin and tests
        run: >-
          cmake --build build
          --config Debug
          --target Paladin PaladinTests PaladinAssetTests
          --parallel

      - name: Run automated tests
        run: ctest --test-dir build -C Debug --output-on-failure

  software-art-validation:
    name: Software-rendered art validation
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure art validation
        run: >-
          cmake -S . -B art-build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPALADIN_BUILD_APPLICATION_SMOKE_TESTS=ON

      - name: Prepare art review output
        run: New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\art-review"

      - name: Build and run software-rendered art review
        env:
          PALADIN_ART_REVIEW: "1"
          PALADIN_SMOKE_SCREENSHOTS: ${{ github.workspace }}\art-review
        run: >-
          cmake --build art-build
          --target PaladinArtCheck
          --parallel

      - name: Verify application input and army deployment
        env:
          PALADIN_SMOKE_UI_ONLY: "1"
          PALADIN_SMOKE_SCREENSHOTS: ${{ github.workspace }}\art-review
        run: ctest --test-dir art-build -R "^PaladinApplicationSmokeTests$" --output-on-failure

      - name: Require focused world regression evidence
        shell: pwsh
        run: |
          $required = @("pr25-coast-mask.png", "pr25-flat-political.png", "pr25-flat-terrain.png", "pr25-globe-political.png", "pr25-globe-terrain.png", "pr25-sun-glare.png", "pr25-sun-planet.png", "pr25-marker-motion.csv", "pr26-military-panel.png", "pr26-world-city.png", "pr26-world-marching.png", "pr26-walk-0.png", "pr26-gather-2.png", "pr26-sleep-close.png", "pr26-sleep-normal.png", "pr26-ui-states.png", "pr29-compact-unit-grid.png", "pr27-selection-skinned.png", "pr27-rule-buildings.png", "pr27-close-border-only.png", "pr27-army-globe-selected.bmp", "pr27-army-flat-selected.bmp", "pr27-army-half-tile-march.bmp", "pr29-diplomacy-blank.png", "pr29-diplomacy-actions.png", "pr29-diplomacy-tributary.png", "pr29-military-overflow-top.png", "pr29-military-overflow-bottom.png", "pr29-army-unselected.png", "pr29-army-selected.png", "pr29-army-far.png", "pr29-flat-government.png", "pr29-globe-government.png", "pr29-flat-population.png", "pr29-globe-population.png", "pr29-select-tribal-globe.bmp", "pr29-select-civic-flat.bmp", "pr29-fortress-icon.png", "pr29-fortress-population-invariant.png")
          $required += @("pr30-barracks-hover.bmp", "pr30-foreign-settlement-globe.bmp", "pr30-foreign-settlement-flat.bmp", "pr30-shipment-setup.bmp", "pr30-settlement-caravans.bmp", "pr30-caravan-flat.bmp", "pr30-caravan-globe.bmp", "pr30-settlement-dragged.bmp", "pr30-laws.bmp", "pr30-technology-tree.bmp", "pr30-citizenship-researched.bmp", "pr30-silhouette-citizen-male-6-0-selected.png", "pr30-silhouette-citizen-female-128-3-selected.png")
          foreach ($file in $required) {
            if (-not (Test-Path "art-review/$file")) { throw "Missing mandatory render evidence: $file" }
          }
          $frames = Import-Csv "art-review/pr25-marker-motion.csv"
          if ($frames.Count -ne 480) { throw "Expected 480 marker-motion frames, got $($frames.Count)" }

      - name: Upload software-rendered review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paladin-software-art-review
          path: art-review
          if-no-files-found: error
          retention-days: 14
