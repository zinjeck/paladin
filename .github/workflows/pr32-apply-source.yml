name: PR32 source-only publication
on:
  push:
    branches: [fix/pr32-further-updates]
    paths: [.github/workflows/pr32-apply-source.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'zinjeck/paladin' && github.ref == 'refs/heads/fix/pr32-further-updates'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply the integrity-checked source patch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 30016147983811456f72329891918f5fcb5b23e3
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, re, subprocess
          envelope = pathlib.Path('.github/workflows/pr32-publish.yml').read_text()
          encoded = re.search(r"encoded = '''([^']+)'''", envelope).group(1)
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '2567c2ecce734681d8501be2376656243db6c441bd939c53b37ab2c19a2b76fd'
          path = pathlib.Path('/tmp/pr32-source.patch')
          path.write_bytes(patch)
          arguments = ['git', 'apply', '--index', '--exclude=.github/workflows/*']
          subprocess.run(arguments + ['--check', str(path)], check=True)
          subprocess.run(arguments + [str(path)], check=True)
          # Match the actual SettlementObjectFootprint member in the UI fixture.
          source = pathlib.Path('tests/ApplicationSmokeTests.cpp')
          text = source.read_text()
          assert text.count('object->footprint.origin.') == 2
          source.write_text(text.replace('object->footprint.origin.', 'object->footprint.topLeft.'))
          subprocess.run(['git', 'add', str(source)], check=True)
          PY
          git diff --cached --check
          git config user.name 'Paladin PR32 completion'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete depot input lifetime, eligible AI commerce and patrol navigation'
          git push origin HEAD:refs/heads/fix/pr32-further-updates
