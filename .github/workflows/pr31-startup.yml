name: PR31 startup source publication
on:
  push:
    branches: [feat/pr31-world-interaction-battle-simulation]
    paths: [.github/workflows/pr31-startup.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'zinjeck/paladin' && github.ref == 'refs/heads/feat/pr31-world-interaction-battle-simulation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply checked source and remove publisher
        shell: python
        run: |
          import base64,gzip,hashlib,pathlib,subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^') == '7228374d433988a3baace8a6f702d6ab58f9d9b9'
          encoded=''
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='8cbb363d85416517ea6dcd9bce845e221d5d757922500db0fd7d9cc5d15822c3'
          path=pathlib.Path('/tmp/startup.patch');path.write_bytes(patch)
          allowed={'CMakeLists.txt','src/core/Application.cpp','src/core/Application.h','src/rendering/AssetUpload.h','src/rendering/Renderer.cpp','src/rendering/Renderer.h','src/rendering/SceneSpriteLibrary.cpp','src/rendering/SceneSpriteLibrary.h','tests/Pr31ApplicationTests.cpp'}
          assert {line.split('\t')[-1] for line in git('apply','--numstat',str(path)).splitlines()}==allowed
          subprocess.run(['git','apply','--check','--index',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          git('rm','.github/workflows/pr31-startup.yml')
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','feat(pr31): real startup loading screen and reusable resident sprite caches')
          git('push','origin','HEAD:refs/heads/feat/pr31-world-interaction-battle-simulation')
      - name: Archive source checkpoint
        run: |
          mkdir checkpoint
          git rev-parse HEAD > checkpoint/commit.txt
          git archive HEAD | gzip -n > checkpoint/source.tar.gz
          sha256sum checkpoint/source.tar.gz > checkpoint/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pr31-startup-source
          path: checkpoint
          retention-days: 7
