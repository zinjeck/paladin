name: PR31 controlled source publication
on:
  push:
    branches: [feat/pr31-world-interaction-battle-simulation]
    paths: [.github/workflows/pr31-publish.yml]
permissions:
  contents: write
concurrency:
  group: pr31-source-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'zinjeck/paladin' && github.ref == 'refs/heads/feat/pr31-world-interaction-battle-simulation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply exact reviewed source patch
        shell: python
        run: |
          import base64, gzip, hashlib, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse','HEAD^') == '426fc11d07285af293cfdd6cbdf14d949e1307c5', 'Branch changed; refuse to overwrite new work'
          encoded = ''
          # Transport is checked before Git sees any patch content.
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '0fad8a94e93fa26bb5d2532d96f9b25b6dab170e7bca9e2960000c14622af402'
          target = pathlib.Path('/tmp/pr31.patch'); target.write_bytes(patch)
          allowed = {'src/simulation/MilitarySystem.cpp','src/simulation/WorldShipmentSystem.cpp','src/simulation/systems/SettlementActivitySystem.cpp','src/simulation/systems/SettlementAnimalWork.cpp','src/world/Army.h','tests/Pr31AnimalNavigationChecks.h','tests/TestMain.cpp'}
          changed = {line.split('\t')[-1] for line in git('apply','--numstat',str(target)).splitlines()}
          assert changed == allowed
          subprocess.run(['git','apply','--check','--index',str(target)],check=True)
          subprocess.run(['git','apply','--index',str(target)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','fix(pr31): diagonal obstacle-safe marching and occupied-pasture animal gathering')
          git('push','origin','HEAD:refs/heads/feat/pr31-world-interaction-battle-simulation')
      - name: Save recoverable source checkpoint
        run: |
          mkdir checkpoint
          git rev-parse HEAD > checkpoint/commit.txt
          git archive HEAD | gzip -n > checkpoint/source.tar.gz
          sha256sum checkpoint/source.tar.gz > checkpoint/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pr31-source-checkpoint
          path: checkpoint
          retention-days: 7
