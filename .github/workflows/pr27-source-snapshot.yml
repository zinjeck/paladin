name: PR repair source snapshot

# Temporary, branch-only review input. Removed before this PR is marked ready.
on:
  push:
    branches: [fix/upright-settlements-and-military-controls]
    paths: [.github/workflows/pr27-source-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bundle the exact checkout and pinned dependency sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/paladin-deps"
          git clone --depth 1 --branch release-3.2.20 https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/paladin-deps/sdl3-src"
          git clone --depth 1 --branch release-3.2.2 --recurse-submodules --shallow-submodules https://github.com/libsdl-org/SDL_ttf.git "$RUNNER_TEMP/paladin-deps/sdl3_ttf-src"
          git clone --depth 1 --branch release-3.2.4 https://github.com/libsdl-org/SDL_image.git "$RUNNER_TEMP/paladin-deps/sdl3_image-src"
          tar --exclude=.git -czf "$RUNNER_TEMP/paladin-source.tar.gz" .
          tar --exclude=.git -czf "$RUNNER_TEMP/paladin-dependencies.tar.gz" -C "$RUNNER_TEMP/paladin-deps" .
          cd "$RUNNER_TEMP"
          sha256sum paladin-source.tar.gz paladin-dependencies.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: paladin-pr-repair-source
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/paladin-source.tar.gz
            ${{ runner.temp }}/paladin-dependencies.tar.gz
            ${{ runner.temp }}/SHA256SUMS
